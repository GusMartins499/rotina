apiVersion: v1
kind: ServiceAccount
metadata:
  name: rotina
  namespace: rotina
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-state
  namespace: rotina
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tailscale-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-state
  namespace: rotina
subjects:
  - kind: ServiceAccount
    name: rotina
    namespace: rotina
roleRef:
  kind: Role
  name: tailscale-state
  apiGroup: rbac.authorization.k8s.io
